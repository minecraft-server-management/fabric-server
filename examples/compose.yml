services:
  server:
    image: ghcr.io/minecraft-server-management/fabric-server:latest
    container_name: "fabric-server"
    restart: unless-stopped
    environment:
      EULA: "true"
      MEMORY: "4G"

    ports:
      - "25565:25565"

    volumes:
      - ./data:/data
      - ./mods:/mods
      - ./mods.json:/config/mods.json

    stdin_open: true
    tty: true
