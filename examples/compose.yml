services:
  server:
    image: 'ghcr.io/minecraft-server-management/fabric-server:latest'
    container_name: 'fabric-server'
    restart: on-failure:3
    environment:
      EULA: 'true'
      MEMORY: '4G'
      MINECRAFT_VERSION: '26.2'

    ports:
      - '25565:25565'

    volumes:
      - './data:/data'
      - './mods:/mods'
      - './mods.json:/config/mods.json'

    stdin_open: true
    tty: true
